name: ITX Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rs-src: ${{ steps.filter.outputs.rs-src }}
      go-src: ${{ steps.filter.outputs.go-src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            rs-src:
              - 'itx-rs/**'
              - 'integration-tests/**'
              - 'storage/**'
              - 'openapi.yaml'
              - '.github/workflows/itx-testing.yml'
            go-src:
              - 'itx-go/**'
              - 'integration-tests/**'
              - 'storage/**'
              - 'openapi.yaml'
              - '.github/workflows/itx-testing.yml'

  rust-integration-test:
    name: rust-integration-test (${{ matrix.profile }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: onprem
            docker-init-services: mariadb-init
          - profile: aws
            docker-init-services: postgres-init
    defaults:
      run:
        working-directory: integration-tests
    env:
      IS_COVERAGE_RUN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install Python dependencies
        run: uv sync

      - name: Check formatting
        run: make check

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: taiki-e/install-action@faf6515f98a6da02430741fd0af1094fde82286d # cargo-llvm-cov

      - name: Set Rust caching env vars
        if: env.IS_COVERAGE_RUN == 'false'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Set llvm-cov env vars
        if: env.IS_COVERAGE_RUN == 'true'
        working-directory: itx-rs
        run: |
          cargo llvm-cov show-env | sed -E "s/^([^=]+)='(.*)'$/\1=\2/" >> "$GITHUB_ENV"

      - name: Check Rust formatting
        if: needs.changes.outputs.rs-src == 'true'
        working-directory: itx-rs
        run: cargo fmt --all -- --check

      - name: Clean coverage data
        if: needs.changes.outputs.rs-src == 'true' && env.IS_COVERAGE_RUN == 'true'
        working-directory: itx-rs
        run: cargo llvm-cov clean --workspace

      - name: Build binaries
        if: needs.changes.outputs.rs-src == 'true'
        working-directory: itx-rs
        run: cargo build

      - name: Start containers
        if: needs.changes.outputs.rs-src == 'true'
        run: docker compose up -d

      - name: Wait for init services
        if: needs.changes.outputs.rs-src == 'true'
        run: docker compose wait ${{ matrix.docker-init-services }}

      - name: Run integration tests
        if: needs.changes.outputs.rs-src == 'true'
        timeout-minutes: 5
        run: uv run pytest --durations=50
        env:
          ITX_TEST_PROFILE: ${{ matrix.profile }}

      - name: Generate test coverage
        if: needs.changes.outputs.rs-src == 'true' && env.IS_COVERAGE_RUN == 'true'
        working-directory: itx-rs
        run: cargo llvm-cov report --summary-only

      - name: Shutdown containers
        if: needs.changes.outputs.rs-src == 'true'
        run: docker compose down --remove-orphans -v --timeout 5 || true

  golang-integration-test:
    name: golang-integration-test (${{ matrix.profile }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: onprem
            docker-init-services: mariadb-init
          - profile: aws
            docker-init-services: postgres-init
    defaults:
      run:
        working-directory: integration-tests
    env:
      ITX_LANG: golang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install Python dependencies
        run: uv sync

      - name: Check formatting
        run: make check

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: itx-go/itx-backend/go.mod
          cache-dependency-path: itx-go/itx-backend/go.sum

      - name: Check Go formatting
        if: needs.changes.outputs.go-src == 'true'
        working-directory: itx-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build binaries
        if: needs.changes.outputs.go-src == 'true'
        working-directory: itx-go
        run: make build

      - name: Start containers
        if: needs.changes.outputs.go-src == 'true'
        run: docker compose up -d

      - name: Wait for init services
        if: needs.changes.outputs.go-src == 'true'
        run: docker compose wait ${{ matrix.docker-init-services }}

      - name: Run integration tests
        if: needs.changes.outputs.go-src == 'true'
        timeout-minutes: 5
        run: uv run pytest --durations=50
        env:
          ITX_TEST_PROFILE: ${{ matrix.profile }}

      - name: Shutdown containers
        if: needs.changes.outputs.go-src == 'true'
        run: docker compose down --remove-orphans -v --timeout 5 || true
